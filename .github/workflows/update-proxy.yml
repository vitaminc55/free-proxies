name: Update converted proxy list

on:
  repository_dispatch:
    types: [cron-trigger]

permissions:
  contents: write

concurrency:
  group: update-converted-proxy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert proxy list
        run: python3 scripts/convert_proxy.py

      - name: Commit and push if changed
        run: |
          if [ ! -f proxy_converted.txt ]; then
            echo "proxy_converted.txt not found"
            exit 1
          fi
          git add proxy_converted.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update converted proxy list"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
